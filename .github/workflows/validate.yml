name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure:
    name: Plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SKILL.md exists
        run: test -f evalhub/SKILL.md
      - name: Check scripts directory
        run: test -d evalhub/scripts
      - name: Check required scripts
        run: |
          for script in evalhub_check evalhub_providers evalhub_collections evalhub_eval evalhub_status evalhub_logs; do
            test -f "evalhub/scripts/${script}.py" || { echo "Missing: ${script}.py"; exit 1; }
          done
      - name: Validate plugin.json
        run: python -m json.tool .claude-plugin/plugin.json > /dev/null
      - name: Validate marketplace.json
        run: python -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: Check marketplace skill paths exist
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())
          missing = [
              path
              for plugin in data.get("plugins", [])
              for path in plugin.get("skills", [])
              if not pathlib.Path(path).is_dir()
          ]
          if missing:
              print(f"Missing skill directories: {missing}", file=sys.stderr)
              sys.exit(1)
          print("All marketplace skill paths exist")
          PY
